<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="../img/Logo.png" type="image/png" />
    <link rel="stylesheet" href="DetalhesLivro.css" />
    <title>LitLog | Detalhes do Livro</title>
    <script src="../env.dev.js"></script>

  <body>
    <header>
      <div class="margem" id="LogoLandinPage">
        <a href="../HomePage/Home.html">
          <img src="../Img/Logo.png" height="70px" />
        </a>
        <a href="../HomePage/Home.html">Litlog</a>
      </div>

      <div class="atalhos">

    </header>

    <main class="container">
      <!-- ESQUERDA -->
      <div class="left">
        <div class="capa">
          <img id="bookCover" width="100%" height="100%" />
        </div>

        <h1 class="titulo" id="bookTitle">Carregando livro...</h1>

        <div class="descricao">
          <p id="bookDescription"></p>
        </div>

      <!-- DIREITA -->
      <div class="right">
        <div class="onde" id="bookAuthor"></div>
        <div class="preco" id="bookYear"></div>
        <div class="avaliacao" id="bookRating">
          <img src="../Img/rating stars.png" class="estrelas" />
        </div>
        <h1 class="onde" id="bookReviews">Últimas Resenhas</h1>
        <p>ResenhasResenhasResenhas ResenhasResenha</p>
        <button class="add">Adicionar à Lista</button>
