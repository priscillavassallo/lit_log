</header>
    <div
      class="modalLog"
      id="modalLog"
      aria-hidden="true"
      onclick="fecharModalPorFora(event)"
    >
      <div
        class="conteudoModalLog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalLog"
      >
        <button
          class="fecharModalLog"
          type="button"
          onclick="fecharModalLog()"
          aria-label="Fechar"
        >
          x
        </button>
        <h2 id="tituloModalLog">Novo log</h2>
        <form class="formLog" onsubmit="salvarLog(event)">
          <label for="livroLog">Livro</label>
          <input
              class="input"
              id="livroLog"
              type="text"
              placeholder="Nome do livro"
              required
            />

          <label for="autorLog">Autor</label>
          <input class="input" id="autorLog" type="text" placeholder="Nome do autor" />

          <label for="statusLog">Status</label>
          <select class="input" id="statusLog">
            <option>Lendo</option>
            <option>Quero ler</option>
            <option>Concluído</option>
          </select>

          <div class="acoesModalLog">
            <button
              class="btn-secondary"
              type="button"
              onclick="fecharModalLog()"
            >
              Cancelar
            </button>
            <button class="btn-primary" type="submit">Salvar</button>
          </div>
        </form>
      </div>
    </div>
    <section class="section-container">
    <div class="perfil-container">

      <div class="profname">
        <div class="imgcontainer">
          <img
            src="https://www.indy100.com/media-library/the-gen-z-stare-why-millennials-are-so-bothered-by-it.jpg?id=65262954&width=1245&height=700&quality=50&coordinates=0%2C0%2C0%2C0"
            alt="Imagem De Perfil"
          />
        </div>

        <div class="nome">
          <h1>Mapê</h1>
        </div>

        <div class="descricao-container">
          <textarea id="desc" placeholder="Fale dos seus gostos e interesses" readonly>
              Gosto de livros que me fazem pensar, e mais ainda de livros que me fazem parar de pensar
          </textarea>

          <button id="btnDesc">Editar</button>
        </div>
      </div>

      <div class="profabas">
        <div class="social-container">
          <span>Seguindo</span>
          <span>Seguidores</span>
        </div>
          <div class="abascontainer">
            <div class="abas">

          </div>

          <div class="abas">
            <h2>Lidos recentemente</h2>
          </div>
        </div>
      </div>

    </div>
