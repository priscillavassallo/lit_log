<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="../Img/Logo.png" type="image/png" />

    <link rel="stylesheet" href="../CSS/variavel.css" />
    <link rel="stylesheet" href="../CSS/global.css" />
    <link rel="stylesheet" href="../CSS/componentes.css" />
    <link rel="stylesheet" href="../compartilhado/modal.css" />
    <link rel="stylesheet" href="Perfil.css" />

    <title>Meu Perfil</title>
  </head>

  <body>
    <header class="topbar">
      <a href="../HomePage/Home.html" class="topbar-logo">
        <img src="../Img/Logo.png" alt="Logo LitLog" class="topbar-logo-img" />
        <span>LitLog</span>
      </a>

      <nav class="topbar-nav">
        <div class="topbar-profile">
          <a href="../PerfilPage/Perfil.html" class="topbar-link">Meu Perfil</a>
          <details class="topbar-profile-dropdown">
            <summary
              class="topbar-profile-trigger"
              aria-label="Abrir menu do perfil"
            ></summary>
            <div class="topbar-profile-menu">
              <a href="../ThePilePage/ThePile.html">Pilha de Livros</a>
              <a href="../DiaryPage/Diary.html">Diario</a>
              <a href="../List/list.html">Listas</a>
            </div>
          </details>
        </div>
        <a href="../LivrosPage/Livros.html" class="topbar-link">Livros</a>
        <a href="../MembrosPage/teladelista.html" class="topbar-link"
          >Coleções</a
        >

        <a
          href="../PesquisaPage/Pesquisa.html"
          class="topbar-search"
          aria-label="Pesquisar"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
            <path
              d="M 21 3 C 11.601563 3 4 10.601563 4 20 C 4 29.398438 11.601563 37 21 37 C 24.355469 37 27.460938 36.015625 30.09375 34.34375 L 42.375 46.625 L 46.625 42.375 L 34.5 30.28125 C 36.679688 27.421875 38 23.878906 38 20 C 38 10.601563 30.398438 3 21 3 Z M 21 7 C 28.199219 7 34 12.800781 34 20 C 34 27.199219 28.199219 33 21 33 C 13.800781 33 8 27.199219 8 20 C 8 12.800781 13.800781 7 21 7 Z"
            ></path>
          </svg>
        </a>

        <button class="btn-primary" type="button" onclick="abrirModalLog()">
          + Log
        </button>
      </nav>
    </header>

    <section class="section-container">
      <div class="perfil-container">
        <div class="profname">
          <div class="wrapper">
            <button
              class="btnSeguir bgSeguir"
              id="btnSeguir"
              type="button"
              aria-label="Seguir"
            >
              <img src="../Img/person_add.svg" class="iconSeguir" alt="" />
              <img
                src="../Img/person_remove.svg"
                class="iconPararDeSeguir oculta"
                alt=""
              />
              <span class="textoBtnSeguir">Seguir</span>
            </button>
            <div class="imgcontainer">
              <img
                src="../Img/user.png"
                alt="Imagem De Perfil"
                id="fotoPerfil"
              />

              <div id="selectFile-contianer">
                <input type="file" id="selectFoto" accept="image/*" />
                <span id="textFile">Alterar foto de perfil</span>
              </div>
            </div>
          </div>

          <div class="nome">
            <h1>Nome de Exibição</h1>
            <h3>Nome de Usuário</h3>
          </div>

          <div class="descricao-container">
            <textarea
              id="desc"
              placeholder="Fale dos seus gostos e interesses"
              readonly
            ></textarea>

            <button id="btnDesc">Editar</button>
          </div>
        </div>

        <div class="profabas">
          <div class="social-container" aria-label="Conexões do perfil">
            <button
              class="social-button"
              id="btnSeguindo"
              type="button"
              aria-label="Ver pessoas que este perfil segue"
            >
              <span class="social-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm0 2c-4.42 0-7 2.17-7 5v1h9.26A6.94 6.94 0 0 1 11 17c0-1.5.47-2.89 1.27-4H9Zm9-1v3h-3v2h3v3h2v-3h3v-2h-3v-3h-2Z"
                  />
                </svg>
              </span>
              <span class="social-content">
                <strong id="quantidadeSeguindo">0</strong>
                <span>Seguindo</span>
              </span>
              <span class="social-arrow" aria-hidden="true">›</span>
            </button>

            <button
              class="social-button"
              id="btnSeguidores"
              type="button"
              aria-label="Ver seguidores deste perfil"
            >
              <span class="social-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    d="M16 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8ZM8 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8Zm8 2c-1.1 0-2.08.13-2.95.37A5.8 5.8 0 0 1 15 17.5V20h7v-1c0-3.78-2.74-6-6-6ZM8 13c-3.26 0-6 2.22-6 6v1h11v-2.5C13 14.5 10.76 13 8 13Z"
                  />
                </svg>
              </span>
              <span class="social-content">
                <strong id="quantidadeSeguidores">0</strong>
                <span>Seguidores</span>
              </span>
              <span class="social-arrow" aria-hidden="true">›</span>
            </button>
          </div>

          <div class="abascontainer">
            <a href="../ThePilePage/ThePile.html" id="linkThePile">
              <button class="abas">
                <h2>Pilha de Livros</h2>
              </button>
            </a>

            <a href="../DiaryPage/Diary.html" id="linkDiary">
              <button class="abas">
                <h2>Diário</h2>
              </button>
            </a>

            <a href="../List/list.html" id="linkList">
              <button class="abas">
                <h2>Listas</h2>
              </button>
            </a>

            <div class="sairContainer">
              <button class="linkSair" id="idLinkSair" type="button">
                Sair
              </button>
            </div>
          </div>
        </div>
      </div>
    </section>

    <div
      class="modalLog"
      id="modalConfirmarSaida"
      aria-hidden="true"
      onclick="fecharModalSaidaPorFora(event)"
    >
      <div
        class="conteudoModalLog modal-saida"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalSaida"
      >
        <button
          class="fecharModalLog"
          type="button"
          onclick="fecharModalSaida()"
          aria-label="Fechar confirmação de saída"
        >
          &times;
        </button>

        <h2 id="tituloModalSaida">Gostaria de sair?</h2>
        <p>Você precisará entrar novamente para acessar o seu perfil.</p>

        <div class="acoes-modal-saida">
          <button
            class="botao-cancelar-saida"
            type="button"
            onclick="fecharModalSaida()"
          >
            Cancelar
          </button>
          <button
            class="botao-confirmar-saida"
            id="btnConfirmarSaida"
            type="button"
          >
            Sair
          </button>
        </div>
      </div>
    </div>

    <script src="../compartilhado/livros.js"></script>
    <script src="../compartilhado/modal.js"></script>
    <script src="Perfil.js"></script>
  </body>
</html>
