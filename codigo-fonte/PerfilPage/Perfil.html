<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="../Img/Logo.png" type="image/png" />
    <link rel="stylesheet" href="../compartilhado/modal.css" />
    <link rel="stylesheet" href="Perfil.css" />
    <title>Meu Perfil </title>
  </head>
  <body>
    <header>
      <div class="margem" id="LogoLandinPage">
        <a href="../HomePage/Home.html"
          ><img
            src="../Img/Logo.png"
            alt=""
            height="70px"
            style="margin-left: 5pc; margin-right: 5px; margin-top: 10px"
        /></a>
      </div>
      <div>
        <a href="../HomePage/Home.html">Litlog</a>
      </div>
      <div></div>
      <div><a href="../PerfilPage/Perfil.html">Meu Perfil</a></div>
      <div><a href="../LivrosPage/Livros.html">Livros</a></div>
      <div><a href="../MembrosPage/teladelista.html">Coleções</a></div>
      <div>
        <a href="../PesquisaPage/Pesquisa.html"
          ><svg
            xmlns="http://www.w3.org/2000/svg"
            x="0px"
            y="0px"
            width="100"
            height="100"
            viewBox="0 0 50 50"
          >
            <path
              d="M 21 3 C 11.601563 3 4 10.601563 4 20 C 4 29.398438 11.601563 37 21 37 C 24.355469 37 27.460938 36.015625 30.09375 34.34375 L 42.375 46.625 L 46.625 42.375 L 34.5 30.28125 C 36.679688 27.421875 38 23.878906 38 20 C 38 10.601563 30.398438 3 21 3 Z M 21 7 C 28.199219 7 34 12.800781 34 20 C 34 27.199219 28.199219 33 21 33 C 13.800781 33 8 27.199219 8 20 C 8 12.800781 13.800781 7 21 7 Z"
            ></path></svg
        ></a>
      </div>
      <div>
        <button class="botaoLog" type="button" onclick="abrirModalLog()">
          + Log
        </button>
      </div>
    </header>
    <div
      class="modalLog"
      id="modalLog"
      aria-hidden="true"
      onclick="fecharModalPorFora(event)"
    >
      <div
        class="conteudoModalLog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalLog"
      >
        <button
          class="fecharModalLog"
          type="button"
          onclick="fecharModalLog()"
          aria-label="Fechar"
        >
          x
        </button>
        <h2 id="tituloModalLog">Novo log</h2>
        <form class="formLog" onsubmit="salvarLog(event)">
          <label for="livroLog">Livro</label>
          <input
            id="livroLog"
            type="text"
            placeholder="Nome do livro"
            required
          />

          <label for="autorLog">Autor</label>
          <input id="autorLog" type="text" placeholder="Nome do autor" />

          <label for="statusLog">Status</label>
          <select id="statusLog">
            <option>Lendo</option>
            <option>Quero ler</option>
            <option>Concluido</option>
          </select>

          <div class="acoesModalLog">
            <button
              class="botaoCancelarLog"
              type="button"
              onclick="fecharModalLog()"
            >
              Cancelar
            </button>
            <button class="botaoSalvarLog" type="submit">Salvar</button>
          </div>
        </form>
      </div>
    </div>
    <section class="section-container">
      <div class="perfil-container">
        <div class="profname">
          <div class="imgcontainer">
            <img
              src="https://www.indy100.com/media-library/the-gen-z-stare-why-millennials-are-so-bothered-by-it.jpg?id=65262954&width=1245&height=700&quality=50&coordinates=0%2C0%2C0%2C0"
              alt="Imagem De Perfil"
            />
          </div>
          <div class="nome">
            <h1>Mapê</h1>
          </div>
          <div class="descricao">
            <p>
              Gosto de livros que me fazem pensar, e mais ainda de livros que me
              fazem parar de pensar
            </p>
          </div>
        </div>

        <div class="profabas">
          <div class="social-container">
            <span>Seguindo</span>
            <span>Seguidores</span>
          </div>

          <div class="abascontainer">
            <div class="abas">
              <h2>Pilha de Livros</h2>
            </div>

            <div class="abas">
              <h2>Diario</h2>
            </div>

            <div class="abas">
              <h2><a href="../List/list.html">Listas</a></h2>
            </div>

            <div class="abas">
              <h2>Livros Favoritos</h2>
            </div>

            <div class="abas">
              <h2>Lidos recentemente</h2>
            </div>
          </div>
        </div>
      </div>
    </section>
    <script src="../compartilhado/modal.js"></script>
  </body>
</html>
