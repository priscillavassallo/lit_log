<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="../Img/Logo.png" type="image/png" />
    <link rel="stylesheet" href="Cadastrar.css" />
    <title>LitLog</title>
  </head>
  <body>
    <header>
      <div class="margem" id="LogoLandinPage">
        <a href="../LangingPage/Landing.html">
          <img
            src="../Img/Logo.png"
            alt=""
            height="70px"
            style="margin-left: 5pc; margin-right: 5px; margin-top: 10px"
          />
        </a>
      </div>
      <div>
        <a href="../LangingPage/Landing.html">Litlog</a>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <form class="form-container" action="../HomePage/Home.html">
          <div class="title-form">
            <h1>Criar Conta</h1>
          </div>

          <div>
            <label for="username">Nome de usuário</label>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Escolha um nome de usuário"
              required
            />
          </div>

          <div>
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

          <div>
            <label for="password">Senha</label>
            <input
              type="password"
              name="password"
              id="senha"
              placeholder="Insira sua senha"
              required
            />
          </div>

          <div class="btn-container">
            <button type="submit" id="submit">Cadastrar</button>
            <p>
              Já tem uma conta?
              <a href="../LoginPage/LoginPage.html"
                ><span class="login-link">Entrar</span></a
              >
            </p>
          </div>
        </form>

        <div class="image-container">
          <img
            src="../Img/girl-library-floor-reading.jpg"
            alt="menina lendo na biblioteca"
          />
        </div>
      </div>
    </section>
  <script src="Usuarios.js"></script>
  </body>
</html>
