<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="../Img/Logo.png" type="image/png" />
    <link rel="stylesheet" href="Cadastrar.css" />
    <title>LitLog</title>
  </head>
  <body>
    <header></header>

    <section class="section">
      <div class="container">
        <form
          class="form-container"
          id="formCadastro"
          action="../HomePage/Home.html"
        >
          <div class="title-form">
            <h1>Criar Conta</h1>
          </div>

          <div>
            <label for="name">Como quer ser chamado</label>
            <input
              type="text"
              name="name"
              id="name"
              placeholder="Insira seu nome ou apelido"
              required
            />
          </div>

          <div>
            <label for="username">Nome de usuário</label>
            <input
              type="text"
              name="username"
              id="username"
              placeholder="Crie um nome de usuário"
              required
            />
          </div>

          <div>
            <label for="email">E-mail</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="Insira seu melhor e-mail"
              required
            />
          </div>

          <div>
            <label for="password">Senha</label>
            <input
              type="password"
              name="password"
              id="senha"
              placeholder="Crie uma senha"
              required
            />
            <small id="senha-helper"> Use pelo menos 8 caracteres. </small>
          </div>

          <div class="btn-container">
            <button type="submit" id="submit">Cadastrar</button>
            <p>
              Já tem uma conta?
              <a href="../LoginPage/LoginPage.html"
                ><span class="login-link">Entrar</span></a
              >
            </p>
          </div>
        </form>

        <div class="image-container">
          <img
            src="../Img/girl-library-floor-reading.jpg"
            alt="menina lendo na biblioteca"
          />
        </div>
      </div>
    </section>
    <script src="Usuarios.js"></script>
  </body>
</html>
