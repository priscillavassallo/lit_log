<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>
    <link rel="stylesheet" href="Cadastrar.css">
</head>
<body>
    <header>
        <div class="margem" id="LogoLandinPage">
            <a href="../HomePage/Home.html"><img src="../Img/Logo.png" alt="" height="70px" style="margin-left: 5pc; margin-right: 5px; margin-top: 10px;" ></a>
        </div>
        <div>
            <a href="../HomePage/Home.html">Litlog</a>
        </div>
    </header>
    <section class="section">
       
        <div class="container">
           
            <form class="form-container">
                 <div class="title-form">
                <h1>Create Account</h1>
            </div>
                <div>
                    <label for="username">Username</label>
                    <input type="text" name="username" placeholder="Choose a username" required>
                </div>
                
                <div>
                    <label for="email">Email</label>
                    <input type="email" name="email" placeholder="you@example.com" required>
                </div>

                <div>
                    <label for="password">Password</label>
                    <input type="password" name="password" placeholder="Enter your password" required>
                </div>
                <div class="btn-container">
                    <button type="submit" class="submit">Sign Up</button>
                    <p>Already have an account? <a href="../LoginPage/Login.html"><span class="login-link">Log in</span></a></p>
                </div>
            </form>
            <div class="image-container">
                <img src="../Img/girl-library-floor-reading.jpg" alt="girl-reading">
            </div>
        </div>
    </section>
   

</body>
</html>
