<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="../Img/Logo.png" type="image/png" />
    <link rel="stylesheet" href="LoginPage.css" />
    <title>Login | LitLog</title>
  </head>
  <body>
    <header>
      <div class="margem" id="LogoLandinPage">
        <a href="../LangingPage/Landing.html">
          <img
            src="../Img/Logo.png"
            alt=""
            height="70px"
            style="margin-left: 5pc; margin-right: 5px; margin-top: 10px"
          />
        </a>
      </div>
      <div>
        <a href="../LangingPage/Landing.html">Litlog</a>
      </div>
    </header>

    <section class="section">
      <div class="container">
        <form class="form-container" id="formCadastro" >
          <div class="title-form">
            <h1>Login</h1>
          </div>
          <div class="email-password-container">
            
            <div>
            <label for="email">Email</label>
            <input
              type="email"
              name="email"
              id="email"
              placeholder="voce@exemplo.com"
              required
            />
          </div>

            <div>
              <label for="password">Senha</label>
              <input
                type="password"
                name="password"
                id="senha"
                placeholder="Insira sua senha"
                required
              />
            </div>
          </div>
          

          <div class="btn-container">
            <button type="submit" class="submit">Entrar</button>
            <p>
              Não tem uma conta?
              <a href="../CadastroPage/Cadastrar.html"
                ><span class="cadastrar-link">Cadastre-se</span></a
              >
            </p>
          </div>
        </form>

        <div class="image-container">
          <img
            src="../Img/mulher-lendo-deitada.jpg"
            alt="Mulher lendo ao ar livre"
          />
        </div>
      </div>
    </section>
    <script src="ValidaçãoLogin.js"></script>
  </body>
</html>
