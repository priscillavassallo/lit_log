<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="../Img/Logo.png" type="image/png" />

    <link rel="stylesheet" href="../CSS/variavel.css" />
    <link rel="stylesheet" href="../CSS/global.css" />
    <link rel="stylesheet" href="../CSS/componentes.css" />
    <link rel="stylesheet" href="../compartilhado/modal.css" />
    <link rel="stylesheet" href="ThePile.css" />

    <title>Pilha de Livros - LitLog</title>
  </head>

  <body>
    <header class="topbar">
      <a href="../HomePage/Home.html" class="topbar-logo">
        <img src="../Img/Logo.png" alt="Logo LitLog" class="topbar-logo-img" />
        <span>LitLog</span>
      </a>

      <nav class="topbar-nav">
        <a href="../PerfilPage/Perfil.html" class="topbar-link">Meu Perfil</a>
        <a href="../LivrosPage/Livros.html" class="topbar-link">Livros</a>
        <a href="../MembrosPage/teladelista.html" class="topbar-link">Coleções</a>

        <a
          href="../PesquisaPage/Pesquisa.html"
          class="topbar-search"
          aria-label="Pesquisar"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
            <path
              d="M 21 3 C 11.601563 3 4 10.601563 4 20 C 4 29.398438 11.601563 37 21 37 C 24.355469 37 27.460938 36.015625 30.09375 34.34375 L 42.375 46.625 L 46.625 42.375 L 34.5 30.28125 C 36.679688 27.421875 38 23.878906 38 20 C 38 10.601563 30.398438 3 21 3 Z M 21 7 C 28.199219 7 34 12.800781 34 20 C 34 27.199219 28.199219 33 21 33 C 13.800781 33 8 27.199219 8 20 C 8 12.800781 13.800781 7 21 7 Z"
            ></path>
          </svg>
        </a>

        <button class="btn-primary" type="button" onclick="abrirModalLog()">
          + Log
        </button>
      </nav>
    </header>

    <main class="pile-page">
      <section class="pile-hero">
        <h1>Pilha de Livros</h1>
        <p>Sua pilha de livros para ler, organizar e acompanhar.</p>
      </section>

      <section class="pile-filters" aria-label="Filtros da pilha de livros">
        <button
          class="pile-filter active"
          type="button"
          data-filter="Todos"
          onclick="filtrarPilha('Todos', this)"
        >
          Todos
        </button>

        <button
          class="pile-filter"
          type="button"
          data-filter="Quero ler"
          onclick="filtrarPilha('Quero ler', this)"
        >
          Quero ler
        </button>

        <button
          class="pile-filter"
          type="button"
          data-filter="Lendo"
          onclick="filtrarPilha('Lendo', this)"
        >
          Lendo
        </button>

        <button
          class="pile-filter"
          type="button"
          data-filter="Lido"
          onclick="filtrarPilha('Lido', this)"
        >
          Lidos
        </button>
      </section>

      <section class="pile-grid" id="gradeLivros"></section>
    </main>

    <script>
      const chavePilhaLivros = "litlog_pilha_livros";
      let filtroAtual = "Todos";

      const livrosExemploPilha = [
        {
          titulo: "A Biblioteca da Meia-Noite",
          autor: "Matt Haig",
          capa: "https://covers.openlibrary.org/b/isbn/9780525559474-M.jpg",
          status: "Lendo",
        },
        {
          titulo: "Dom Quixote",
          autor: "Miguel de Cervantes",
          capa: "https://covers.openlibrary.org/b/isbn/9780060934347-M.jpg",
          status: "Quero ler",
        },
        {
          titulo: "O Processo",
          autor: "Franz Kafka",
          capa: "https://covers.openlibrary.org/b/isbn/9780805209990-M.jpg",
          status: "Lido",
        },
        {
          titulo: "O Hobbit",
          autor: "J.R.R. Tolkien",
          capa: "https://covers.openlibrary.org/b/isbn/9780547928227-M.jpg",
          status: "Quero ler",
        },
      ];

      function limparTexto(texto) {
        return String(texto)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function buscarPilhaLivros() {
        const pilhaSalva = localStorage.getItem(chavePilhaLivros);

        if (!pilhaSalva) {
          salvarPilhaLivros(livrosExemploPilha);
          return livrosExemploPilha;
        }

        const pilha = JSON.parse(pilhaSalva);

        if (pilha.length === 0) {
          salvarPilhaLivros(livrosExemploPilha);
          return livrosExemploPilha;
        }

        return pilha;
      }

      function salvarPilhaLivros(pilha) {
        localStorage.setItem(chavePilhaLivros, JSON.stringify(pilha));
      }

      function alterarStatusLivro(index, novoStatus) {
        const pilha = buscarPilhaLivros();
        const livroAlterado = pilha[index];

        pilha[index].status = novoStatus;
        salvarPilhaLivros(pilha);

        const registrosDiario =
          JSON.parse(localStorage.getItem("litlog_registros_diario")) || [];

        registrosDiario.forEach(function (registro) {
          if (registro.livro === livroAlterado.titulo) {
            registro.status = novoStatus;
          }
        });

        localStorage.setItem(
          "litlog_registros_diario",
          JSON.stringify(registrosDiario)
        );

        renderizarPilhaLivros();
      }

      function excluirLivroDaPilha(index) {
        const confirmarExclusao = confirm(
          "Tem certeza que deseja excluir este livro da pilha e seus registros no diário?"
        );

        if (!confirmarExclusao) {
          return;
        }

        const pilha = buscarPilhaLivros();
        const livroRemovido = pilha[index];

        pilha.splice(index, 1);
        salvarPilhaLivros(pilha);

        const registrosDiario =
          JSON.parse(localStorage.getItem("litlog_registros_diario")) || [];

        const registrosAtualizados = registrosDiario.filter(function (registro) {
          return registro.livro !== livroRemovido.titulo;
        });

        localStorage.setItem(
          "litlog_registros_diario",
          JSON.stringify(registrosAtualizados)
        );

        renderizarPilhaLivros();
      }

      function filtrarPilha(filtro, botao) {
        filtroAtual = filtro;

        const botoes = document.querySelectorAll(".pile-filter");

        botoes.forEach(function (item) {
          item.classList.remove("active");
        });

        botao.classList.add("active");
        renderizarPilhaLivros();
      }

      function obterClasseStatus(status) {
        if (status === "Lendo") {
          return "status-lendo";
        }

        if (status === "Lido") {
          return "status-lido";
        }

        return "status-quero-ler";
      }

      function renderizarPilhaLivros() {
        const gradeLivros = document.getElementById("gradeLivros");
        const pilha = buscarPilhaLivros();

        const livrosFiltrados = pilha
          .map(function (livro, index) {
            return {
              livro: livro,
              indexOriginal: index,
            };
          })
          .filter(function (item) {
            return filtroAtual === "Todos" || item.livro.status === filtroAtual;
          });

        gradeLivros.innerHTML = "";

        if (livrosFiltrados.length === 0) {
          gradeLivros.innerHTML = `
            <p class="pile-empty">
              Nenhum livro encontrado neste filtro.
            </p>
          `;
          return;
        }

        livrosFiltrados.forEach(function (item) {
          const livro = item.livro;
          const indexOriginal = item.indexOriginal;
          const classeStatus = obterClasseStatus(livro.status);

          const card = document.createElement("article");
          card.classList.add("pile-book-card");

          card.innerHTML = `
            <div class="pile-cover-wrapper">
              <img
                class="pile-cover"
                src="${limparTexto(livro.capa)}"
                alt="Capa do livro ${limparTexto(livro.titulo)}"
              />
            </div>

            <div class="pile-book-info">
              <h3>${limparTexto(livro.titulo)}</h3>
              <p>${limparTexto(livro.autor)}</p>

              <span class="pile-status ${classeStatus}">
                ${limparTexto(livro.status)}
              </span>

              <label class="pile-status-label" for="statusLivro${indexOriginal}">
                Alterar status
              </label>

              <select
                id="statusLivro${indexOriginal}"
                class="pile-status-select"
                onchange="alterarStatusLivro(${indexOriginal}, this.value)"
              >
                <option value="Quero ler" ${livro.status === "Quero ler" ? "selected" : ""}>Quero ler</option>
                <option value="Lendo" ${livro.status === "Lendo" ? "selected" : ""}>Lendo</option>
                <option value="Lido" ${livro.status === "Lido" ? "selected" : ""}>Lido</option>
              </select>

              <button
                class="pile-delete"
                type="button"
                onclick="excluirLivroDaPilha(${indexOriginal})"
              >
                Excluir
              </button>
            </div>
          `;

          gradeLivros.appendChild(card);
        });
      }

      document.addEventListener("DOMContentLoaded", function () {
        renderizarPilhaLivros();
      });
    </script>

    <script src="../compartilhado/livros.js"></script>
    <script src="../compartilhado/modal.js"></script>
  </body>
</html>
