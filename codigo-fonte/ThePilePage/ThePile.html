    <main class="pile-page">
      <section class="pile-hero">
        <h1>Pilha de Livros</h1>
        <p>Sua pilha de livros para ler, organizar e acompanhar.</p>
      </section>

      <section class="pile-filters" aria-label="Filtros da pilha de livros">
        <button
          class="pile-filter active"
          type="button"
          data-filter="Todos"
          onclick="filtrarPilha('Todos', this)"
        >
          Todos
        </button>

        <button
          class="pile-filter"
          type="button"
          data-filter="Quero ler"
          onclick="filtrarPilha('Quero ler', this)"
        >
          Quero ler
        </button>

        <button
          class="pile-filter"
          type="button"
          data-filter="Lendo"
          onclick="filtrarPilha('Lendo', this)"
        >
          Lendo
        </button>

        <button
          class="pile-filter"
          type="button"
          data-filter="Lido"
          onclick="filtrarPilha('Lido', this)"
        >
          Lidos
        </button>
      </section>

      <section class="pile-grid" id="gradeLivros"></section>
    </main>

    <div class="pile-delete-overlay" id="modalExcluirPilha">
      <div class="pile-delete-box">
        <h2>Excluir da pilha</h2>

        <p id="textoExclusaoPilha">
          Tem certeza que deseja remover este livro da Pilha?
        </p>

        <div class="pile-comments-area">
          <h3>Comentários no Diário</h3>

          <p class="pile-comments-help" id="resumoComentariosPilha">
            Nenhum comentário encontrado para este livro.
          </p>

          <label for="acaoComentariosPilha">
            O que deseja fazer com os comentários?
          </label>

          <select
            id="acaoComentariosPilha"
            onchange="alterarAcaoComentariosPilha()"
          >
            <option value="manter">Manter comentários no Diário</option>
            <option value="todos">
              Apagar todos os comentários deste livro
            </option>
            <option value="um">Apagar apenas um comentário específico</option>
          </select>

          <div
            class="pile-comment-select-area"
            id="areaSelecionarComentarioPilha"
          >
            <label for="comentarioSelecionadoPilha">
              Escolha o comentário
            </label>

            <select id="comentarioSelecionadoPilha"></select>
          </div>
        </div>

        <div class="pile-delete-actions">
          <button
            class="btn-secondary"
            type="button"
            onclick="fecharModalExclusaoPilha()"
          >
            Cancelar
          </button>

          <button
            class="btn-primary"
            type="button"
            onclick="confirmarExclusaoPilha()"
          >
            Confirmar exclusão
          </button>
        </div>
      </div>
    </div>

    <script>
      const chavePilhaLivros = "litlog_pilha_livros";
      const chaveRegistrosDiario = "litlog_registros_diario";
      const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
      const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

      if (!usuarioLogado) {
        window.location.href = "../LoginPage/LoginPage.html";
        throw new Error("Usuário não autenticado.");
      }

      const parametros = new URLSearchParams(window.location.search);
      const pageName = parametros.get("username");
      const ownerName = pageName || usuarioLogado.nomeUsuario;
      const sameUser = usuarioLogado.nomeUsuario === ownerName;
      const perfilAtivo = sameUser
        ? usuarioLogado
        : usuarios.find((user) => user.nomeUsuario === ownerName);

      if (!perfilAtivo) {
        throw new Error("Proprietário da pilha não encontrado.");
      }

      let filtroAtual = "Todos";
      let indiceLivroParaExcluir = null;

      const livrosExemploPilha = [
        {
          titulo: "A Biblioteca da Meia-Noite",
          autor: "Matt Haig",
          capa: "https://covers.openlibrary.org/b/isbn/9780525559474-M.jpg",
          status: "Lendo",
        },
        {
          titulo: "Dom Quixote",
          autor: "Miguel de Cervantes",
          capa: "https://covers.openlibrary.org/b/isbn/9780060934347-M.jpg",
          status: "Quero ler",
        },
        {
          titulo: "O Processo",
          autor: "Franz Kafka",
          capa: "https://covers.openlibrary.org/b/isbn/9780805209990-M.jpg",
          status: "Lido",
        },
        {
          titulo: "O Hobbit",
          autor: "J.R.R. Tolkien",
          capa: "https://covers.openlibrary.org/b/isbn/9780547928227-M.jpg",
          status: "Quero ler",
        },
      ];

      function limparTexto(texto) {
        return String(texto)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function buscarPilhaCompleta() {
        const pilhaSalva =
          JSON.parse(localStorage.getItem(chavePilhaLivros)) || [];
        let pilhaAlterada = false;

        const registros =
          JSON.parse(localStorage.getItem(chaveRegistrosDiario)) || [];

        pilhaSalva.forEach(function (livro) {
          const possiveisDonos = registros
            .filter(function (registro) {
              return (
                registro.registrante &&
                ((livro.isbn && registro.isbn === livro.isbn) ||
                  registro.livro === livro.titulo)
              );
            })
            .map(function (registro) {
              return registro.registrante;
            })
            .filter(function (nomeUsuario, index, lista) {
              return lista.indexOf(nomeUsuario) === index;
            });

          const donoTemRegistro = possiveisDonos.includes(livro.dono);

          if (!donoTemRegistro && possiveisDonos.length === 1) {
            livro.dono = possiveisDonos[0];
            pilhaAlterada = true;
          }
        });

        const livrosUnicos = [];

        pilhaSalva.forEach(function (livro) {
          if (!livro.dono) return;

          const duplicado = livrosUnicos.some(function (item) {
            return (
              item.dono === livro.dono &&
              ((livro.isbn && item.isbn === livro.isbn) ||
                item.titulo === livro.titulo)
            );
          });

          if (duplicado) {
            pilhaAlterada = true;
            return;
          }

          livrosUnicos.push(livro);
        });

        if (livrosUnicos.length !== pilhaSalva.length) {
          pilhaSalva.splice(0, pilhaSalva.length, ...livrosUnicos);
        }

        const registrosDoPerfil = registros.filter(function (registro) {
          return registro.registrante === perfilAtivo.nomeUsuario;
        });
        const chaveMigracao = "litlog_pilha_migrada_" + perfilAtivo.nomeUsuario;

        if (!localStorage.getItem(chaveMigracao)) {
          registrosDoPerfil.forEach(function (registro) {
            const jaExiste = pilhaSalva.some(function (livro) {
              return (
                livro.dono === perfilAtivo.nomeUsuario &&
                ((registro.isbn && livro.isbn === registro.isbn) ||
                  livro.titulo === registro.livro)
              );
            });

            if (jaExiste) return;

            const livroCatalogo =
              typeof livros !== "undefined"
                ? livros.find(function (livro) {
                    return (
                      (registro.isbn && livro.isbn === registro.isbn) ||
                      livro.titulo === registro.livro
                    );
                  })
                : null;

            pilhaSalva.push({
              isbn: registro.isbn || livroCatalogo?.isbn || "",
              titulo: registro.livro,
              autor:
                registro.autor || livroCatalogo?.autor || "Autor desconhecido",
              capa: livroCatalogo?.capa || "../Img/sem-capa.png",
              status: registro.status || "Quero ler",
              dono: perfilAtivo.nomeUsuario,
            });
            pilhaAlterada = true;
          });

          localStorage.setItem(chaveMigracao, "true");
        }

        if (pilhaAlterada) {
          salvarPilhaLivros(pilhaSalva);
        }

        return pilhaSalva;
      }

      function buscarPilhaLivrosThePile() {
        return buscarPilhaCompleta().filter(function (livro) {
          return livro.dono === perfilAtivo.nomeUsuario;
        });
      }

      function salvarPilhaLivros(pilha) {
        localStorage.setItem(chavePilhaLivros, JSON.stringify(pilha));
      }

      function buscarRegistrosDiario() {
        const registrosSalvos = localStorage.getItem(chaveRegistrosDiario);

        if (!registrosSalvos) {
          return [];
        }

        const registros = JSON.parse(registrosSalvos);

        const registrosComId = registros.map(function (registro, index) {
          if (!registro.id) {
            registro.id = Date.now() + index;
          }

          return registro;
        });

        localStorage.setItem(
          chaveRegistrosDiario,
          JSON.stringify(registrosComId),
        );

        return registrosComId;
      }

      function salvarRegistrosDiario(registros) {
        localStorage.setItem(chaveRegistrosDiario, JSON.stringify(registros));
      }

      function alterarStatusLivro(index, novoStatus) {
        const pilha = buscarPilhaLivrosThePile();
        const livroAlterado = pilha[index];
        const pilhaCompleta = buscarPilhaCompleta();
        const livroNaPilhaCompleta = pilhaCompleta.find(function (livro) {
          return (
            livro.dono === perfilAtivo.nomeUsuario &&
            ((livroAlterado.isbn && livro.isbn === livroAlterado.isbn) ||
              livro.titulo === livroAlterado.titulo)
          );
        });

        if (!livroNaPilhaCompleta) return;

        livroNaPilhaCompleta.status = novoStatus;
        salvarPilhaLivros(pilhaCompleta);

        const registrosDiario = buscarRegistrosDiario();

        registrosDiario.forEach(function (registro) {
          if (
            registro.registrante === perfilAtivo.nomeUsuario &&
            registro.livro === livroAlterado.titulo
          ) {
            registro.status = novoStatus;
          }
        });

        salvarRegistrosDiario(registrosDiario);
        renderizarPilhaLivros();
      }

      function abrirModalExclusaoPilha(index) {
        const pilha = buscarPilhaLivrosThePile();
        const livro = pilha[index];
        const comentarios = buscarComentariosDoLivro(livro.titulo);

        indiceLivroParaExcluir = index;

        document.getElementById("textoExclusaoPilha").textContent =
          'Você está removendo "' + livro.titulo + '" da Pilha de Livros.';

        renderizarComentariosExclusaoPilha(comentarios);

        document
          .getElementById("modalExcluirPilha")
          .classList.add("modal-aberto");
      }

      function fecharModalExclusaoPilha() {
        indiceLivroParaExcluir = null;

        document
          .getElementById("modalExcluirPilha")
          .classList.remove("modal-aberto");
      }

      function buscarComentariosDoLivro(tituloLivro) {
        const registrosDiario = buscarRegistrosDiario();

        return registrosDiario.filter(function (registro) {
          return (
            registro.registrante === perfilAtivo.nomeUsuario &&
            registro.livro === tituloLivro
          );
        });
      }

      function renderizarComentariosExclusaoPilha(comentarios) {
        const resumoComentarios = document.getElementById(
          "resumoComentariosPilha",
        );

        const acaoComentarios = document.getElementById("acaoComentariosPilha");

        const comentarioSelecionado = document.getElementById(
          "comentarioSelecionadoPilha",
        );

        const areaSelecionarComentario = document.getElementById(
          "areaSelecionarComentarioPilha",
        );

        comentarioSelecionado.innerHTML = "";
        acaoComentarios.value = "manter";
        areaSelecionarComentario.style.display = "none";

        if (comentarios.length === 0) {
          resumoComentarios.textContent =
            "Este livro não possui comentários no Diário.";

          acaoComentarios.disabled = true;
          return;
        }

        acaoComentarios.disabled = false;

        resumoComentarios.textContent =
          "Este livro possui " +
          comentarios.length +
          (comentarios.length === 1
            ? " comentário no Diário."
            : " comentários no Diário.");

        comentarios.forEach(function (comentario) {
          const option = document.createElement("option");

          option.value = comentario.id;
          option.textContent =
            "Página " +
            (comentario.pagina || "Não informado") +
            " • " +
            (comentario.data || "Sem data") +
            " • " +
            (comentario.anotacao || "Sem anotação");

          comentarioSelecionado.appendChild(option);
        });
      }

      function alterarAcaoComentariosPilha() {
        const acaoComentarios = document.getElementById(
          "acaoComentariosPilha",
        ).value;

        const areaSelecionarComentario = document.getElementById(
          "areaSelecionarComentarioPilha",
        );

        if (acaoComentarios === "um") {
          areaSelecionarComentario.style.display = "flex";
        } else {
          areaSelecionarComentario.style.display = "none";
        }
      }

      function confirmarExclusaoPilha() {
        if (indiceLivroParaExcluir === null) {
          return;
        }

        const pilha = buscarPilhaLivrosThePile();
        const livroRemovido = pilha[indiceLivroParaExcluir];
        const pilhaCompleta = buscarPilhaCompleta();
        const acaoComentarios = document.getElementById(
          "acaoComentariosPilha",
        ).value;

        const pilhaAtualizada = pilhaCompleta.filter(function (livro) {
          const mesmoLivro =
            (livroRemovido.isbn && livro.isbn === livroRemovido.isbn) ||
            livro.titulo === livroRemovido.titulo;

          return !(livro.dono === perfilAtivo.nomeUsuario && mesmoLivro);
        });
        salvarPilhaLivros(pilhaAtualizada);

        let registrosDiario = buscarRegistrosDiario();

        if (acaoComentarios === "todos") {
          registrosDiario = registrosDiario.filter(function (registro) {
            return !(
              registro.registrante === perfilAtivo.nomeUsuario &&
              registro.livro === livroRemovido.titulo
            );
          });
        }

        if (acaoComentarios === "um") {
          const comentarioSelecionado = Number(
            document.getElementById("comentarioSelecionadoPilha").value,
          );

          registrosDiario = registrosDiario.filter(function (registro) {
            return !(
              registro.registrante === perfilAtivo.nomeUsuario &&
              Number(registro.id) === comentarioSelecionado
            );
          });
        }

        salvarRegistrosDiario(registrosDiario);

        fecharModalExclusaoPilha();
        renderizarPilhaLivros();
      }

      function filtrarPilha(filtro, botao) {
        filtroAtual = filtro;

        const botoes = document.querySelectorAll(".pile-filter");

        botoes.forEach(function (item) {
          item.classList.remove("active");
        });

        botao.classList.add("active");
        renderizarPilhaLivros();
      }

      function obterClasseStatus(status) {
        if (status === "Lendo") {
          return "status-lendo";
        }

        if (status === "Lido") {
          return "status-lido";
        }

        return "status-quero-ler";
      }

      function obterIsbnLivro(livro) {
        if (livro.isbn) {
          return livro.isbn;
        }

        const capa = livro.capa || "";
        const resultado = capa.match(/\/isbn\/([0-9Xx]+)-/);

        if (resultado) {
          return resultado[1];
        }

        return null;
      }

      function abrirDetalhesLivro(livro) {
        const isbn = obterIsbnLivro(livro);

        if (!isbn) {
          alert("Não foi possível abrir os detalhes deste livro.");
          return;
        }

        window.location.href =
          "../DetalhesLivroPage/DetalhesLivro.html?isbn=" +
          encodeURIComponent(isbn);
      }

      function renderizarPilhaLivros() {
        const gradeLivros = document.getElementById("gradeLivros");
        const pilha = buscarPilhaLivrosThePile();
        const livrosFiltrados = pilha
          .map(function (livro, index) {
            return {
              livro: livro,
              indexOriginal: index,
            };
          })
          .filter(function (item) {
            return filtroAtual === "Todos" || item.livro.status === filtroAtual;
          });

        gradeLivros.innerHTML = "";

        if (livrosFiltrados.length === 0) {
          gradeLivros.innerHTML = `
            <p class="pile-empty">
              Nenhum livro encontrado neste filtro.
            </p>
          `;
          return;
        }

        livrosFiltrados.forEach(function (item) {
          const livro = item.livro;
          const indexOriginal = item.indexOriginal;
          const classeStatus = obterClasseStatus(livro.status);

          const card = document.createElement("article");
          card.classList.add("pile-book-card");

          card.addEventListener("click", function () {
            abrirDetalhesLivro(livro);
          });
          const deletarEAlterar = sameUser
            ? `
              <label class="pile-status-label" for="statusLivro${indexOriginal}">
                Alterar status
              </label>

              <select
                id="statusLivro${indexOriginal}"
                class="pile-status-select"
                onclick="event.stopPropagation()"
                onchange="event.stopPropagation(); alterarStatusLivro(${indexOriginal}, this.value)"
              >
                <option value="Quero ler" ${livro.status === "Quero ler" ? "selected" : ""}>Quero ler</option>
                <option value="Lendo" ${livro.status === "Lendo" ? "selected" : ""}>Lendo</option>
                <option value="Lido" ${livro.status === "Lido" ? "selected" : ""}>Lido</option>
              </select>

              <button
                class="pile-delete"
                type="button"
                onclick="event.stopPropagation(); abrirModalExclusaoPilha(${indexOriginal})"
              >
                Excluir
              </button>`
            : "";

          card.innerHTML = `
            <div class="pile-cover-wrapper">
              <img
                class="pile-cover"
                src="${limparTexto(livro.capa)}"
                alt="Capa do livro ${limparTexto(livro.titulo)}"
              />
            </div>

            <div class="pile-book-info">
              <h3>${limparTexto(livro.titulo)}</h3>
              <p>${limparTexto(livro.autor)}</p>

              <span class="pile-status ${classeStatus}">
                ${limparTexto(livro.status)}
              </span>

            </div>
          `;
          gradeLivros.appendChild(card);
        });
      }

      document.addEventListener("DOMContentLoaded", function () {
        renderizarPilhaLivros();
      });
    </script>

    <script src="../compartilhado/livros.js"></script>
    <script src="../compartilhado/modal.js"></script>
  </body>
