<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="list.css">
    <title>LitLog</title>
</head>
<body>
<section class="list-page">

    <div class="list-container">

    <div class="topo-listas">

        <h1>Minhas Listas</h1>

        <button id="abrir-popup" class="criar-lista">
            + Nova Lista
        </button>

    </div>

    <div class="list-grid" id="list-grid">

        <!-- LISTAS APARECEM AQUI -->

    </div>

</div>

</section>

<div class="overlay hidden"></div>

<div class="popup hidden">

    <h2>Nova Lista</h2>

    <input 
        type="text"
        id="nome-lista"
        placeholder="Nome da lista"
    >

    <button id="criar-lista-popup">
        Criar
    </button>

</div>

<script src="../CadastroPage/Usuarios.js"></script>

<script>

console.log("JS funcionando");



const botao = document.getElementById("abrir-popup");

const popup = document.querySelector(".popup");

const overlay = document.querySelector(".overlay");

const input = document.getElementById("nome-lista");

const btnCriar = document.getElementById("criar-lista-popup");

const grid = document.getElementById("list-grid");

const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'))

botao.addEventListener("click", () => {

    popup.classList.remove("hidden");

    overlay.classList.remove("hidden");

});

function criarLista(){
    
    const nomeLista = input.value;
    const listaDuplicada = usuarioLogado.listas.some((lista)=> lista.nome === nomeLista)
    if(listaDuplicada) {
        alert('Esse nome de lista já está em uso. Use outro nome')
        return
    }
    if(nomeLista === "") return;

    usuarioLogado.listas.push(
        {   nome: nomeLista,
        livros: []
        }
    )

  localStorage.setItem('usuarioLogado',JSON.stringify(usuarioLogado))
   const ultimaLista = usuarioLogado.listas.at(-1)
   renderizarLista(ultimaLista)

  

}

function renderizarLista(lista){
    const novoCard = document.createElement("div");

    novoCard.classList.add("list-card");

    novoCard.innerHTML = `
    
    <div class="fake-cover">
        📚
    </div>

    <div class="list-info">
        <h2>${lista.nome}</h2>
        <p>${lista.livros.length===0? 'Nenhum livro':lista.livros.length>1?lista.livros.length + ' livros':'1 Livro'}</p>
        <div>
            <button class="excluirL" data-lista="${lista.nome}">Excluir lista</button>
        </div>
    </div>

    `;
    
const btnExcluir = novoCard.querySelector('.excluirL')
btnExcluir.addEventListener('click', (e)=>{
    e.stopPropagation()

    const btnClicado = e.target.dataset.lista
    const cardSelecionado = usuarioLogado.listas.findIndex((lista)=>lista.nome=== btnClicado)
    usuarioLogado.listas.splice(cardSelecionado,1)
    const respExcluir = confirm('Sua lista será excluída permanentemente. Pressione OK para continuar.')
    if(respExcluir){
    localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado))
    location.reload()
    }
    
})


    novoCard.addEventListener("click", () => {

    window.location.href = `lista.html?nome=${lista.nome}`;

    });

    grid.appendChild(novoCard);

    input.value = "";

    popup.classList.add("hidden");

    overlay.classList.add("hidden");
}

btnCriar.addEventListener("click",criarLista)
usuarioLogado.listas.forEach(lista => {
    renderizarLista(lista)
    
});


overlay.addEventListener("click", () => {

    popup.classList.add("hidden");

    overlay.classList.add("hidden");

});




</script>

</body>
</html>
