<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="../Img/Logo.png" type="image/png" />

    <link rel="stylesheet" href="../CSS/variavel.css" />
    <link rel="stylesheet" href="../CSS/global.css" />
    <link rel="stylesheet" href="../CSS/componentes.css" />
    <link rel="stylesheet" href="../compartilhado/modal.css" />
    <link rel="stylesheet" href="list.css" />
    <title>Listas</title>
</head>
<body>
    <header class="topbar">
  <a href="../HomePage/Home.html" class="topbar-logo">
    <img src="../Img/Logo.png" alt="Logo LitLog" class="topbar-logo-img" />
    <span>LitLog</span>
  </a>

  <nav class="topbar-nav">
    <a href="../PerfilPage/Perfil.html" class="topbar-link">Meu Perfil</a>
    <a href="../LivrosPage/Livros.html" class="topbar-link">Livros</a>
    <a href="../MembrosPage/teladelista.html" class="topbar-link">Coleções</a>

    <a href="../PesquisaPage/Pesquisa.html" class="topbar-search" aria-label="Pesquisar">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
        <path
          d="M 21 3 C 11.601563 3 4 10.601563 4 20 C 4 29.398438 11.601563 37 21 37 C 24.355469 37 27.460938 36.015625 30.09375 34.34375 L 42.375 46.625 L 46.625 42.375 L 34.5 30.28125 C 36.679688 27.421875 38 23.878906 38 20 C 38 10.601563 30.398438 3 21 3 Z M 21 7 C 28.199219 7 34 12.800781 34 20 C 34 27.199219 28.199219 33 21 33 C 13.800781 33 8 27.199219 8 20 C 8 12.800781 13.800781 7 21 7 Z"
        ></path>
      </svg>
    </a>

    <button class="btn-primary" type="button" onclick="abrirModalLog()">
      + Log
    </button>
  </nav>
</header>
<section class="list-page">

    <div class="list-container">

    <div class="topo-listas">

        <h1>Minhas Listas</h1>

        <button id="abrir-popup" class="criar-lista">
            + Nova Lista
        </button>

    </div>

    <div class="list-grid" id="list-grid">
    </div>
</div>

</section>

    <div
      class="modalLog"
      id="modalLog"
      aria-hidden="true"
      onclick="fecharModalPorFora(event)"
    >
      <div
        class="conteudoModalLog"
        role="dialog"
        aria-modal="true"
        aria-labelledby="tituloModalLog"
      >
        <button
          class="fecharModalLog"
          type="button"
          onclick="fecharModalLog()"
          aria-label="Fechar"
        >
          &times;
        </button>
        <h2 id="tituloModalLog">Novo log</h2>
        <form class="formLog" onsubmit="salvarLog(event)">
          <label for="livroLog">Livro</label>
          <input
              class="input"
              id="livroLog"
              type="text"
              placeholder="Nome do livro"
              required
            />

          <label for="autorLog">Autor</label>
          <input
              class="input"
              id="autorLog"
              type="text"
              placeholder="Nome do autor"
            />

          <label for="statusLog">Status</label>
          <select class="input" id="statusLog">
            <option>Lendo</option>
            <option>Quero ler</option>
            <option>Concluído</option>
          </select>

          <div class="acoesModalLog">
            <button
              class="btn-secondary"
              type="button"
              onclick="fecharModalLog()"
            >
              Cancelar
            </button>

            <button class="btn-primary" type="submit">
              Salvar
            </button>
          </div>
        </form>
    </div>
</div>
    <div class="overlay hidden"></div>
    <div class="popup hidden">
    <h2>Nova Lista</h2>
    <input 
        type="text"
        id="nome-lista"
        placeholder="Nome da lista"
    >
    <button id="criar-lista-popup">
        Criar
    </button>
</div>

<script src="../CadastroPage/Usuarios.js"></script>

<script>
const botao = document.getElementById("abrir-popup");

const popup = document.querySelector(".popup");

const overlay = document.querySelector(".overlay");

const input = document.getElementById("nome-lista");

const btnCriar = document.getElementById("criar-lista-popup");

const grid = document.getElementById("list-grid");

const usuarioLogado = JSON.parse(localStorage.getItem('usuarioLogado'))

botao.addEventListener("click", () => {

    popup.classList.remove("hidden");

    overlay.classList.remove("hidden");

});

function criarLista(){
    
    const nomeLista = input.value;
    const listaDuplicada = usuarioLogado.listas.some((lista)=> lista.nome === nomeLista)
    if(listaDuplicada) {
        alert('Esse nome de lista já está em uso. Use outro nome')
        return
    }
    if(nomeLista === "") return;

    usuarioLogado.listas.push(
        {   nome: nomeLista,
        livros: []
        }
    )

  localStorage.setItem('usuarioLogado',JSON.stringify(usuarioLogado))
  const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

        const index = usuarios.findIndex(
            u => u.nomeUsuario === usuarioLogado.nomeUsuario
        );

        if (index !== -1) {
            usuarios[index] = usuarioLogado;
        }

        localStorage.setItem('usuarios', JSON.stringify(usuarios));
   const ultimaLista = usuarioLogado.listas.at(-1)
   renderizarLista(ultimaLista)

  

}

function renderizarLista(lista){
    const novoCard = document.createElement("div");

    novoCard.classList.add("list-card");

    novoCard.innerHTML = `
    
    <div class="fake-cover">
        📚
    </div>

    <div class="list-info">
        <h2>${lista.nome}</h2>
        <p>${lista.livros.length===0? 'Nenhum livro':lista.livros.length>1?lista.livros.length + ' livros':'1 Livro'}</p>
        <div>
            <button class="excluirL" data-lista="${lista.nome}">Excluir lista</button>
        </div>
    </div>

    `;
    
const btnExcluir = novoCard.querySelector('.excluirL')
btnExcluir.addEventListener('click', (e)=>{
    e.stopPropagation()

    const btnClicado = e.target.dataset.lista
    const cardSelecionado = usuarioLogado.listas.findIndex((lista)=>lista.nome=== btnClicado)
    usuarioLogado.listas.splice(cardSelecionado,1)
    const respExcluir = confirm('Sua lista será excluída permanentemente. Pressione OK para continuar.')
    if(respExcluir){
    localStorage.setItem('usuarioLogado', JSON.stringify(usuarioLogado))
    const usuarios = JSON.parse(localStorage.getItem('usuarios')) || [];

        const index = usuarios.findIndex(
            u => u.nomeUsuario === usuarioLogado.nomeUsuario
        );

        if (index !== -1) {
            usuarios[index] = usuarioLogado;
        }

        localStorage.setItem('usuarios', JSON.stringify(usuarios));
    location.reload()
    }
    
})


    novoCard.addEventListener("click", () => {

    window.location.href = `lista.html?nome=${lista.nome}`;

    });

    grid.appendChild(novoCard);

    input.value = "";

    popup.classList.add("hidden");

    overlay.classList.add("hidden");
}

btnCriar.addEventListener("click",criarLista)
usuarioLogado.listas.forEach(lista => {
    renderizarLista(lista)
    
});


overlay.addEventListener("click", () => {

    popup.classList.add("hidden");

    overlay.classList.add("hidden");

});
</script>

<script src="../compartilhado/modal.js"></script>
</body>
</html>
