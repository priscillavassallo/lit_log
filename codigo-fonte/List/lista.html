<body>

</header>

    <h1 id="titulo-lista"></h1>

    <span id="aviso">
        Pesquise por um livro e adicione a lista
    </span>

    <span id="pesq">
        <a href="../PesquisaPage/Pesquisa.html" target="_blank">
            Pesquisar Livro >>
        </a>
    </span>

    <div id="lista"></div>

<div
  class="modalLog"
  id="modalLog"
  aria-hidden="true"
  onclick="fecharModalPorFora(event)"
>
  <div
    class="conteudoModalLog"
    role="dialog"
    aria-modal="true"
    aria-labelledby="tituloModalLog"
  >
    <button
      class="fecharModalLog"
      type="button"
      onclick="fecharModalLog()"
      aria-label="Fechar"
    >
      &times;
    </button>

    <h2 id="tituloModalLog">Novo log</h2>

    <form class="formLog" onsubmit="salvarLog(event)">
      <label for="livroLog">Livro</label>
      <input
        id="livroLog"
        type="text"
        list="listaLivrosLog"
        placeholder="Pesquise ou selecione um livro"
        autocomplete="off"
        required
      />
      <datalist id="listaLivrosLog"></datalist>

      <label for="statusLog">Status</label>
      <select id="statusLog" required>
        <option value="Quero ler">Quero ler</option>
        <option value="Lendo">Lendo</option>
        <option value="Lido">Lido</option>
      </select>

      <label for="paginaLog">Página atual</label>
      <input id="paginaLog" type="number" placeholder="Ex: 120" />
<label>Avaliação</label>

      <div class="avaliacaoEstrelas" id="avaliacaoEstrelas">
        <button type="button" class="estrelaLog" data-value="1" onclick="selecionarAvaliacaoLog(1)">☆</button>
        <button type="button" class="estrelaLog" data-value="2" onclick="selecionarAvaliacaoLog(2)">☆</button>
        <button type="button" class="estrelaLog" data-value="3" onclick="selecionarAvaliacaoLog(3)">☆</button>
        <button type="button" class="estrelaLog" data-value="4" onclick="selecionarAvaliacaoLog(4)">☆</button>
        <button type="button" class="estrelaLog" data-value="5" onclick="selecionarAvaliacaoLog(5)">☆</button>
      </div>

      <input type="hidden" id="avaliacaoLog" value="" />

      <label for="anotacaoLog">Anotação</label>
      <textarea
        id="anotacaoLog"
        rows="4"
        placeholder="Escreva suas impressões sobre a leitura"
      ></textarea>

      <div class="acoesModalLog">
        <button
          class="botaoCancelarLog"
          type="button"
          onclick="fecharModalLog()"
        >
          Cancelar
        </button>

        <button class="botaoSalvarLog" type="submit">Salvar</button>
      </div>
    </form>
  </div>
</div>
      

    <script>
  const parametros = new URLSearchParams(window.location.search);
  const nome = parametros.get("nome");

  document.getElementById("titulo-lista").textContent = nome;

  const listaHTML = document.getElementById("lista");
  const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
  const aviso = document.getElementById("aviso");

  const listaAtual = usuarioLogado.listas.find(
    (lista) => lista.nome === nome
  );

  let tamanhoAnterior = listaAtual.livros.length;

  if (listaAtual.livros.length === 0) {
    aviso.textContent =
      "Sua lista está vazia, experimente pesquisar por um livro e adicione a lista";

    listaHTML.style.display = "none";
  } else {
  aviso.style.display = "none";
  document.getElementById("pesq").style.display = "none";
}

  function renderLista(listaAtual) {
    if (listaAtual.livros.length === 0) return;

    listaHTML.style.display = "grid";
    listaHTML.innerHTML = "";

    listaAtual.livros.forEach((livro) => {
      listaHTML.innerHTML += `
        <div id="card-container">
          <a href="../DetalhesLivroPage/DetalhesLivro.html?isbn=${livro.isbn}">
            <img src="${livro.capa}">
          </a>

          <h3>
            <a
              style="text-decoration: none;"
              href="../DetalhesLivroPage/DetalhesLivro.html?isbn=${livro.isbn}"
            >
              ${livro.titulo}
            </a>
          </h3>

      <div class="menu-card">
      
        <button
          class="menu-btn"
          type="button"
          aria-label="Opções"
        ></button>
      
        <div class="menu-dropdown">
          <button
            class="removerL"
            data-isbn="${livro.isbn}"
          >
            Remover
          </button>
        
          </div>
      
        </div>
      </div>
      `;
    });
  }

  renderLista(listaAtual);

document.addEventListener("click", (e) => {

  const menuBtn = e.target.closest(".menu-btn");

  if (menuBtn) {

    const dropdown =
      menuBtn.parentElement.querySelector(".menu-dropdown");

    document.querySelectorAll(".menu-dropdown").forEach((menu) => {
      if (menu !== dropdown) {
        menu.classList.remove("ativo");
      }
    });

    dropdown.classList.toggle("ativo");

    return;
  }

  const removerBtn = e.target.closest(".removerL");

  if (removerBtn) {

    const isbn = removerBtn.dataset.isbn;

    const livroSelecionado =
      listaAtual.livros.findIndex(
        (livro) => livro.isbn === isbn
      );

    if (livroSelecionado !== -1) {

      listaAtual.livros.splice(
        livroSelecionado,
        1
      );

      localStorage.setItem(
        "usuarioLogado",
        JSON.stringify(usuarioLogado)
      );

      location.reload();
    }

    return;
  }

  document.querySelectorAll(".menu-dropdown").forEach((menu) => {
    menu.classList.remove("ativo");
  });

});
</script>

<script src="../compartilhado/modal.js"></script>
</body>

</html>
