<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Minha Lista</title>
</head>

<body>

    <h1 id="titulo-lista"></h1>

    <script>

    const parametros = new URLSearchParams(window.location.search);

    const nome = parametros.get("nome");

    document.getElementById("titulo-lista").textContent = nome;

    </script>

</body>

</html>
