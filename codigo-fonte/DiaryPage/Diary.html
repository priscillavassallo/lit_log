<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="icon" href="../Img/Logo.png" type="image/png" />

    <link rel="stylesheet" href="../CSS/variavel.css" />
    <link rel="stylesheet" href="../CSS/global.css" />
    <link rel="stylesheet" href="../CSS/componentes.css" />
    <link rel="stylesheet" href="../compartilhado/modal.css" />
    <link rel="stylesheet" href="Diary.css" />

    <title>Diário - LitLog</title>
  </head>

  <body>
    <header class="topbar">
      <a href="../HomePage/Home.html" class="topbar-logo">
        <img src="../Img/Logo.png" alt="Logo LitLog" class="topbar-logo-img" />
        <span>LitLog</span>
      </a>

      <nav class="topbar-nav">
        <div class="topbar-profile">
          <a href="../PerfilPage/Perfil.html" class="topbar-link">Meu Perfil</a>
          <details class="topbar-profile-dropdown">
            <summary
              class="topbar-profile-trigger"
              aria-label="Abrir menu do perfil"
            ></summary>
            <div class="topbar-profile-menu">
              <a href="../ThePilePage/ThePile.html">Pilha de Livros</a>
              <a href="../DiaryPage/Diary.html">Diario</a>
              <a href="../List/list.html">Listas</a>
            </div>
          </details>
        </div>
        <a href="../LivrosPage/Livros.html" class="topbar-link">Livros</a>
        <a href="../MembrosPage/teladelista.html" class="topbar-link"
          >Coleções</a
        >

        <a
          href="../PesquisaPage/Pesquisa.html"
          class="topbar-search"
          aria-label="Pesquisar"
        >
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 50 50">
            <path
              d="M 21 3 C 11.601563 3 4 10.601563 4 20 C 4 29.398438 11.601563 37 21 37 C 24.355469 37 27.460938 36.015625 30.09375 34.34375 L 42.375 46.625 L 46.625 42.375 L 34.5 30.28125 C 36.679688 27.421875 38 23.878906 38 20 C 38 10.601563 30.398438 3 21 3 Z M 21 7 C 28.199219 7 34 12.800781 34 20 C 34 27.199219 28.199219 33 21 33 C 13.800781 33 8 27.199219 8 20 C 8 12.800781 13.800781 7 21 7 Z"
            ></path>
          </svg>
        </a>

        <button class="btn-primary" type="button" onclick="abrirModalLog()">
          + Log
        </button>
      </nav>
    </header>

    <main class="diary-page">
      <section class="diary-hero">
        <h1>Diário</h1>
        <p>Registre suas leituras, pensamentos e progresso literário.</p>
      </section>

      <section class="diary-card">
        <h2>Filtros</h2>

        <div class="diary-filters">
          <div class="diary-filter-group">
            <label for="filtroLivroDiario">Livro</label>
            <select id="filtroLivroDiario" onchange="aplicarFiltrosDiario()">
              <option value="todos">Todos os livros</option>
            </select>
          </div>

          <div class="diary-filter-group">
            <label for="filtroStatusDiario">Status</label>
            <select id="filtroStatusDiario" onchange="aplicarFiltrosDiario()">
              <option value="todos">Todos os status</option>
              <option value="Quero ler">Quero ler</option>
              <option value="Lendo">Lendo</option>
              <option value="Lido">Lido</option>
            </select>
          </div>

          <button
            class="btn-secondary"
            type="button"
            onclick="limparFiltrosDiario()"
          >
            Limpar filtros
          </button>
        </div>
      </section>

      <section class="diary-card">
        <h2>Últimos registros</h2>

        <div class="diary-records" id="listaRegistros"></div>
      </section>
    </main>

    <div class="diary-confirm-overlay" id="modalExcluirDiario">
      <div class="diary-confirm-box">
        <h2>Excluir registro</h2>

        <p id="textoExclusaoDiario">
          Tem certeza que deseja excluir este comentário?
        </p>

        <label class="diary-confirm-check">
          <input type="checkbox" id="removerLivroDaPilha" />
          Também remover este livro da Pilha de Livros
        </label>

        <div class="diary-confirm-actions">
          <button
            class="btn-secondary"
            type="button"
            onclick="fecharModalExclusaoDiario()"
          >
            Cancelar
          </button>

          <button
            class="btn-primary"
            type="button"
            onclick="confirmarExclusaoDiario()"
          >
            Excluir
          </button>
        </div>
      </div>
    </div>

    <script>
      const usuarioLogado = JSON.parse(localStorage.getItem("usuarioLogado"));
      const chaveRegistrosDiario = "litlog_registros_diario";
      const parametros = new URLSearchParams(window.location.search);
      const pageName = parametros.get("username");
      let pageUser;
      let sameUser = false;
      if (usuarioLogado.nomeUsuario == pageName || !pageName) {
        console.log("sameuser");
        sameUser = true;
        pageUser = usuarioLogado;
      } else {
        const userList = JSON.parse(localStorage.getItem("usuarios"));
        pageUser = userList.find((user) => {
          return user.nomeUsuario == pageName;
        });
      }
      const perfilAtivo = pageUser;
      let indiceRegistroParaExcluir = null;
      let filtroLivroAtual = "todos";
      let filtroStatusAtual = "todos";

      const registrosExemploDiario = [
        {
          id: Date.now() + 1,
          livro: "Clube da meia-noite",
          autor: "Autor desconhecido",
          status: "Lendo",
          pagina: "45",
          avaliacao: "4",
          data: "Hoje",
          anotacao:
            "A leitura está ficando mais envolvente e os personagens começaram a se conectar melhor.",
        },
        {
          id: Date.now() + 2,
          livro: "Notas de margem",
          autor: "Autor desconhecido",
          status: "Quero ler",
          pagina: "82",
          avaliacao: "3",
          data: "Ontem",
          anotacao:
            "Algumas passagens chamaram atenção pela forma como tratam memória e rotina.",
        },
      ];

      function buscarRegistrosDiario() {
        const registrosSalvos = localStorage.getItem(chaveRegistrosDiario);

        if (registrosSalvos) {
          const registros = JSON.parse(registrosSalvos);

          if (registros.length > 0) {
            const registrosComId = registros.map(function (registro, index) {
              if (!registro.id) {
                registro.id = Date.now() + index;
              }

              return registro;
            });
            salvarRegistrosDiario(registrosComId);
            return registrosComId;
          }
        }

        const pilhaSalva = localStorage.getItem("litlog_pilha_livros");

        if (pilhaSalva) {
          const pilha = JSON.parse(pilhaSalva);

          if (pilha.length > 0) {
            const registrosCriadosPelaPilha = pilha.map(
              function (livro, index) {
                return {
                  id: Date.now() + index,
                  livro: livro.titulo,
                  autor: livro.autor,
                  status: livro.status,
                  pagina: null,
                  avaliacao: null,
                  data: "Importado da pilha",
                  anotacao: "Livro adicionado a partir da Pilha de Livros.",
                };
              },
            );

            salvarRegistrosDiario(registrosCriadosPelaPilha);
            return registrosCriadosPelaPilha;
          }
        }

        salvarRegistrosDiario(registrosExemploDiario);
        return registrosExemploDiario;
      }

      function salvarRegistrosDiario(registros) {
        localStorage.setItem(chaveRegistrosDiario, JSON.stringify(registros));
      }

      function limparTexto(texto) {
        return String(texto)
          .replaceAll("&", "&amp;")
          .replaceAll("<", "&lt;")
          .replaceAll(">", "&gt;")
          .replaceAll('"', "&quot;")
          .replaceAll("'", "&#039;");
      }

      function montarEstrelas(avaliacao) {
        if (!avaliacao || avaliacao === "Sem avaliação") {
          return "Sem avaliação";
        }

        const quantidade = Number(avaliacao);

        if (!quantidade) {
          return "Sem avaliação";
        }

        return "★".repeat(quantidade) + "☆".repeat(5 - quantidade);
      }

      function carregarFiltroLivrosDiario() {
        const filtroLivro = document.getElementById("filtroLivroDiario");
        const registros = buscarRegistrosDiario();

        const valorAtual = filtroLivro.value;

        filtroLivro.innerHTML =
          '<option value="todos">Todos os livros</option>';

        const livrosUnicos = [];

        registros.forEach(function (registro) {
          if (!livrosUnicos.includes(registro.livro)) {
            livrosUnicos.push(registro.livro);
          }
        });

        livrosUnicos.sort(function (a, b) {
          return a.localeCompare(b, "pt-BR");
        });

        livrosUnicos.forEach(function (livro) {
          const option = document.createElement("option");
          option.value = livro;
          option.textContent = livro;
          filtroLivro.appendChild(option);
        });

        if (livrosUnicos.includes(valorAtual)) {
          filtroLivro.value = valorAtual;
        }
      }

      function aplicarFiltrosDiario() {
        filtroLivroAtual = document.getElementById("filtroLivroDiario").value;
        filtroStatusAtual = document.getElementById("filtroStatusDiario").value;

        renderizarRegistrosDiario();
      }

      function limparFiltrosDiario() {
        document.getElementById("filtroLivroDiario").value = "todos";
        document.getElementById("filtroStatusDiario").value = "todos";

        filtroLivroAtual = "todos";
        filtroStatusAtual = "todos";

        renderizarRegistrosDiario();
      }

      function filtrarRegistrosDiario(registros) {
        return registros.filter(function (registro) {
          const filtroLivroOk =
            filtroLivroAtual === "todos" || registro.livro === filtroLivroAtual;

          const filtroStatusOk =
            filtroStatusAtual === "todos" ||
            registro.status === filtroStatusAtual;

          return filtroLivroOk && filtroStatusOk;
        });
      }

      function renderizarRegistrosDiario() {
        const listaRegistros = document.getElementById("listaRegistros");
        const registros = buscarRegistrosDiario();
        const registrosDoUsuario = registros.filter(
          (registro) => registro.registrante === perfilAtivo.nomeUsuario,
        );

        const registrosFiltrados = filtrarRegistrosDiario(registrosDoUsuario);

        listaRegistros.innerHTML = "";

        if (registrosFiltrados.length === 0) {
          listaRegistros.innerHTML = `
            <p class="diary-empty">
              Nenhum registro encontrado.
            </p>
          `;
          return;
        }

        registrosFiltrados.forEach(function (registro) {
          const indexOriginal = registros.findIndex(function (item) {
            return item.id === registro.id;
          });

          const novoRegistro = document.createElement("article");
          novoRegistro.classList.add("diary-record");
          const botãoExcluir = sameUser
            ? `
              <button
                class="diary-delete"
                type="button"
                onclick="abrirModalExclusaoDiario(${indexOriginal})"
              >
                Excluir
              </button>`
            : "";

          novoRegistro.innerHTML = `
            <div class="diary-record-header">
              <div>
                <h3>${limparTexto(registro.livro)}</h3>
                <p class="diary-date">
                  ${limparTexto(registro.autor || "Autor não informado")}
                </p>
              </div>

              ${botãoExcluir}
            </div>

            <p class="diary-date">
              Status: ${limparTexto(registro.status || "Não informado")} •
              ${registro.pagina ? `
              Página ${limparTexto(registro.pagina)} •`:""}
              ${limparTexto(new Date(registro.data).toLocaleString('pt-BR') || "")}
            </p>
            ${registro.avaliacao?
            `<p class="diary-rating">
              ${limparTexto(montarEstrelas(registro.avaliacao))}
            </p>`:""}

            <p>${limparTexto(registro.anotacao || "Sem anotação")}</p>
          `;

          listaRegistros.appendChild(novoRegistro);
        });
      }

      function abrirModalExclusaoDiario(index) {
        const registros = buscarRegistrosDiario();
        const registro = registros[index];

        indiceRegistroParaExcluir = index;

        document.getElementById("removerLivroDaPilha").checked = false;

        document.getElementById("textoExclusaoDiario").textContent =
          'Tem certeza que deseja excluir o comentário sobre "' +
          registro.livro +
          '"?';

        document
          .getElementById("modalExcluirDiario")
          .classList.add("modal-aberto");
      }

      function fecharModalExclusaoDiario() {
        indiceRegistroParaExcluir = null;

        document
          .getElementById("modalExcluirDiario")
          .classList.remove("modal-aberto");
      }

      function confirmarExclusaoDiario() {
        if (indiceRegistroParaExcluir === null) {
          return;
        }

        const registros = buscarRegistrosDiario();
        const registroRemovido = registros[indiceRegistroParaExcluir];
        const removerLivroDaPilha = document.getElementById(
          "removerLivroDaPilha",
        ).checked;

        registros.splice(indiceRegistroParaExcluir, 1);
        salvarRegistrosDiario(registros);

        if (removerLivroDaPilha) {
          const pilha =
            JSON.parse(localStorage.getItem("litlog_pilha_livros")) || [];

          const pilhaAtualizada = pilha.filter(function (livro) {
            return !(
              livro.dono === perfilAtivo.nomeUsuario &&
              livro.titulo === registroRemovido.livro
            );
          });

          localStorage.setItem(
            "litlog_pilha_livros",
            JSON.stringify(pilhaAtualizada),
          );
        }

        fecharModalExclusaoDiario();
        carregarFiltroLivrosDiario();
        renderizarRegistrosDiario();
      }

      document.addEventListener("DOMContentLoaded", function () {
        carregarFiltroLivrosDiario();
        renderizarRegistrosDiario();
      });
    </script>

    <script src="../compartilhado/livros.js"></script>
    <script src="../compartilhado/modal.js"></script>
  </body>
</html>
